services:
  bot:
    build: .
    env_file: .env
    environment:
      DB_PATH: /data/music_bot.db
    ports:
      # Host-only; cloudflared reaches the bot over the compose network at http://bot:<port>.
      - "${ACTIVITY_PUBLISH_IP:-127.0.0.1}:${ACTIVITY_PORT:-8080}:${ACTIVITY_PORT:-8080}"
    volumes:
      # Database, audio cache and bans. Named, as SQLite's WAL is unsafe on Docker Desktop bind mounts.
      - bot-data:/data
      # Old layout, read-only: the first start imports ./music_bot.db and ./audio_cache, then it can go.
      - .:/legacy:ro
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # Lets uvicorn's graceful-shutdown timeout and bot.close() finish before Docker sends SIGKILL.
    stop_grace_period: 45s
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:2026.10.7@sha256:4955524aeaa379e154023d5a027c250f7b35041a2e7e950cf13f144bc9b9c5ba
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN_FILE: /run/secrets/cloudflare_tunnel_token
    secrets:
      - cloudflare_tunnel_token
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      - bot
    restart: unless-stopped

secrets:
  cloudflare_tunnel_token:
    environment: CLOUDFLARE_TUNNEL_TOKEN

volumes:
  bot-data:
