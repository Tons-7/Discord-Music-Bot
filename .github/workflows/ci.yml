name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      # Bug-class rules only; the full rule set still has known style findings.
      - run: uv run ruff check --select F,E9 .
      - run: uv run pytest
