name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  # Keep in step with the uv image pinned in the Dockerfile.
  UV_VERSION: "0.13.4"

jobs:
  python:
    name: Python
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv sync --locked
      - name: requirements.txt mirrors pyproject.toml
        run: uv run python scripts/check_requirements.py
      # Bug-class rules only; the full rule set still has known style findings.
      - run: uv run ruff check --select F,E9 .
      - run: uv run pytest
      # Report-only until pyrefly-baseline.json is committed; from then on only new errors fail.
      - name: Type check (pyrefly)
        continue-on-error: ${{ hashFiles('pyrefly-baseline.json') == '' }}
        run: |
          if [ -f pyrefly-baseline.json ]; then
            uv run pyrefly check --baseline=pyrefly-baseline.json
          else
            uv run pyrefly check
          fi

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: activity-frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: activity-frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run --if-present test
      - run: npm run build
      # Wispbyte serves the committed out/, so it must be rebuilt after frontend changes.
      - name: Committed out/ is up to date
        run: |
          src=$(git log -1 --format=%H -- . ':(exclude)out' ':(glob,exclude)**/*.md' \
            ':(glob,exclude)**/*.test.*' ':(glob,exclude)**/*.spec.*')
          built=$(git log -1 --format=%H -- out)
          if [ -n "$src" ] && { [ -z "$built" ] || ! git merge-base --is-ancestor "$src" "$built"; }; then
            echo "::warning title=Stale activity-frontend/out::Commit $src changed the frontend after out/ was last rebuilt. Run npm run build and commit out/."
          fi

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate docker-compose.yml
        run: touch .env && docker compose config --quiet
      - run: docker build --tag music-bot:ci .
      - run: bash scripts/docker_smoke_test.sh music-bot:ci

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false
      - name: Python (uv.lock)
        run: uv audit --preview-features audit-command --frozen
      - name: npm (production dependencies)
        if: ${{ !cancelled() }}
        working-directory: activity-frontend
        run: npm audit --omit=dev --audit-level=high
