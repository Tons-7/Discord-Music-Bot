[project]
name = "discord-music-bot"
version = "0.1.0"
description = "Discord music bot with YouTube/Spotify/SoundCloud playback and a Discord Activity frontend"
readme = "README.md"
authors = [
    { name = "Tons", email = "tonando1234@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "aiohttp>=3.14.4",
    "davey>=0.1.6",
    "discord-py>=2.7.1",
    "fastapi>=0.156.2",
    "pylast>=7.2.0",
    "pynacl>=1.6.2",
    "python-dotenv>=1.2.4",
    "spotipy>=2.26.0",
    "uvicorn[standard]>=0.54.0",
    "yt-dlp[default]>=2026.10.10.233141.dev0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pyrefly>=1.2.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.6",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
extend-select = ["I", "UP", "B", "C4", "SIM"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI parameter markers are evaluated once by design (B008).
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Security",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.Header",
    "fastapi.Cookie",
    "fastapi.Form",
    "fastapi.File",
]

[tool.pyrefly]
project-includes = ["**/*.py*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
# Raised inside discord.py on Python 3.14.
filterwarnings = ["ignore:'asyncio.iscoroutinefunction' is deprecated:DeprecationWarning"]
